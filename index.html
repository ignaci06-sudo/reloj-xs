<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Reloj Digital - Múltiples Zonas Horarias</title>
    
    <!-- PWA -->
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Reloj Global">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    
    <link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Reloj Global</h1>
            <p class="subtitle">Múltiples Zonas Horarias</p>
        </header>
        
        <div class="clocks-grid" id="clocksGrid">
            <!-- Los relojes se generarán dinámicamente -->
        </div>

        <div class="controls">
            <button id="add-timezone-btn" class="btn-primary">+ Agregar Zona</button>
        </div>
    </div>

    <!-- Modal para agregar zona horaria -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Agregar Nueva Zona Horaria</h2>
            <select id="timezone-select">
                <option value="">Selecciona una zona horaria</option>
                <option value="Africa/Cairo">🇪🇬 El Cairo (Africa/Cairo)</option>
                <option value="Africa/Johannesburg">🇿🇦 Johannesburgo (Africa/Johannesburg)</option>
                <option value="America/Chicago">🇺🇸 Chicago (America/Chicago)</option>
                <option value="America/Denver">🇺🇸 Denver (America/Denver)</option>
                <option value="America/Los_Angeles">🇺🇸 Los Ángeles (America/Los_Angeles)</option>
                <option value="America/Mexico_City">🇲🇽 México (America/Mexico_City)</option>
                <option value="America/Toronto">🇨🇦 Toronto (America/Toronto)</option>
                <option value="America/Argentina/Buenos_Aires">🇦🇷 Buenos Aires (America/Argentina/Buenos_Aires)</option>
                <option value="Asia/Bangkok">🇹🇭 Bangkok (Asia/Bangkok)</option>
                <option value="Asia/Kolkata">🇮🇳 Nueva Delhi (Asia/Kolkata)</option>
                <option value="Asia/Shanghai">🇨🇳 Shanghái (Asia/Shanghai)</option>
                <option value="Asia/Singapore">🇸🇬 Singapur (Asia/Singapore)</option>
                <option value="Asia/Seoul">🇰🇷 Seúl (Asia/Seoul)</option>
                <option value="Europe/Amsterdam">🇳🇱 Ámsterdam (Europe/Amsterdam)</option>
                <option value="Europe/Berlin">🇩🇪 Berlín (Europe/Berlin)</option>
                <option value="Europe/Istanbul">🇹🇷 Estambul (Europe/Istanbul)</option>
                <option value="Europe/Moscow">🇷🇺 Moscú (Europe/Moscow)</option>
                <option value="Europe/Madrid">🇪🇸 Madrid (Europe/Madrid)</option>
                <option value="Pacific/Auckland">🇳🇿 Auckland (Pacific/Auckland)</option>
                <option value="Pacific/Fiji">🇫🇯 Fiyi (Pacific/Fiji)</option>
            </select>
            <button id="add-btn" class="btn-primary">Agregar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
