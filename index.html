<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,
initial-scale=1.0,
viewport-fit=cover">

<title>Retro LED Clock</title>

<!-- PWA -->

<meta
name="theme-color"
content="#000000">

<meta
name="apple-mobile-web-app-capable"
content="yes">

<meta
name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta
name="apple-mobile-web-app-title"
content="Retro Clock">

<meta
name="mobile-web-app-capable"
content="yes">

<link
rel="manifest"
href="manifest.json">

<link
rel="apple-touch-icon"
href="icon.png">

<link
href="https://fonts.cdnfonts.com/css/ds-digital"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{

    height:-webkit-fill-available;

    background:#000;
}

body{

    width:100%;

    min-height:100vh;
    min-height:-webkit-fill-available;

    overflow:hidden;

    background:#000000;

    display:flex;

    justify-content:center;
    align-items:center;

    font-family:
    'DS-Digital',
    monospace;

    overscroll-behavior:none;

    touch-action:none;

    user-select:none;
    -webkit-user-select:none;

    /* Safe areas */

    padding-top:
    env(safe-area-inset-top);

    padding-bottom:
    calc(
    env(safe-area-inset-bottom)
    + 4px
    );
}

.reloj-container{

    width:100%;
    height:100%;

    display:flex;

    justify-content:center;
    align-items:center;

    overflow:hidden;
}

.reloj{

    color:#ff2200;

    white-space:nowrap;

    letter-spacing:0.05em;

    font-size:28vw;

    text-shadow:

    0 0 4px #ff3300,
    0 0 10px #ff0000,
    0 0 18px rgba(255,0,0,0.45);

    will-change:contents;
}

.dos-puntos{

    animation:
    blink 1s steps(2,start) infinite;
}

.numero-apagado{

    opacity:0.08;
}

@keyframes blink{

    0%,49%{
        opacity:1;
    }

    50%,100%{
        opacity:0.10;
    }
}

@media (orientation:portrait){

    .reloj{

        font-size:24vw;
    }
}

</style>

</head>

<body>

<div class="reloj-container">

<div
class="reloj"
id="reloj">

12:45

</div>

</div>

<script>

const reloj =
document.getElementById('reloj');

let modo = 1;

function actualizarReloj(){

    if(modo === 1){

        const ahora = new Date();

        const horas =
        String(
        ahora.getHours()
        ).padStart(2,'0');

        const minutos =
        String(
        ahora.getMinutes()
        ).padStart(2,'0');

        reloj.innerHTML =
        `${horas}<span class="dos-puntos">:</span>${minutos}`;
    }

    else if(modo === 2){

        reloj.innerHTML =
        `<span class="numero-apagado">8</span>5<span class="dos-puntos">:</span>55`;
    }

    else{

        reloj.innerHTML =
        `<span class="numero-apagado">8</span>8<span class="dos-puntos">:</span>88`;
    }
}

actualizarReloj();

setInterval(
actualizarReloj,
1000
);

/* Pulsación larga */

let presionando = false;

let inicioPresion = 0;

function startPress(){

    presionando = true;

    inicioPresion = Date.now();
}

function endPress(){

    if(
    presionando &&
    Date.now() - inicioPresion > 1000
    ){

        modo =
        modo === 3
        ? 1
        : modo + 1;

        actualizarReloj();
    }

    presionando = false;
}

document.addEventListener(
'touchstart',
startPress,
{passive:true}
);

document.addEventListener(
'touchend',
endPress,
{passive:true}
);

document.addEventListener(
'mousedown',
startPress
);

document.addEventListener(
'mouseup',
endPress
);

/* Service Worker */

if(
'serviceWorker'
in navigator
){

    navigator.serviceWorker
    .register('./sw.js');
}

</script>

</body>

</html>
